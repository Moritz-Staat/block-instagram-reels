[versions]
# Toolchain. AGP 9 is available but pulls in a chain the project is not ready for: it ships
# built-in Kotlin, which KSP (and therefore Hilt) does not support; disabling that needs a Kotlin
# release newer than 2.2.21, which in turn moves KSP to its own versioning scheme. Migrating is a
# deliberate piece of work with its own issue and ADR, not a side effect of adding dependencies.
# Everything below is pinned to what actually builds on AGP 8.13.2 / compileSdk 36.
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
# 2.59+ requires AGP 9 ("only compatible with Android Gradle plugin version 9.0.0 or higher").
hilt = "2.58"

# AndroidX. Newer releases of several of these require AGP 9.1 and compileSdk 37 - bump them
# together with the toolchain, not on their own.
coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
composeBom = "2026.06.01"
hiltNavigationCompose = "1.3.0"
datastore = "1.1.7"

coroutines = "1.11.0"
serialization = "1.11.0"
# okhttp 5.x requires compiling against API 37. Stay on 4.12.0 until the toolchain moves.
okhttp = "4.12.0"

junitJupiter = "6.1.3"
junit4 = "4.13.2"
turbine = "1.2.1"
robolectric = "4.17"
androidxTest = "1.6.1"
truth = "1.4.5"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose artefacts are versioned by the BOM - never pin them individually.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# The only HTTP client in this project. It exists for one call - fetching rules.json (R7).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitJupiter" }
# Vintage engine + JUnit4 exist solely so Robolectric, which is JUnit4-based, can run on the
# JUnit Platform alongside Jupiter. Do not write new JUnit4 tests.
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
