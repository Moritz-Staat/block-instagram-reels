name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref is wasted compute; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This workflow reads the repository and nothing else.
permissions:
  contents: read

jobs:
  build:
    name: Static analysis, tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # One command, the same one AGENTS.md tells a human to run before pushing.
      # staticAnalysis covers ktlint, detekt and Android Lint; all three fail the build.
      - name: Static analysis, unit tests and debug build
        run: ./gradlew staticAnalysis testDebugUnitTest assembleDebug

      # A red run is useless if you cannot see what broke.
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            app/build/reports/
            build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Handy for sideloading a build without a local toolchain.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
